spring:
  config:
    import: ""

  datasource:
    url:      ${TEST_DATASOURCE_URL:jdbc:tc:postgresql:16-alpine:///modus_subscription_test}
    username: test
    password: test

  jpa:
    hibernate:
      ddl-auto: none

  flyway:
    enabled: true
    baseline-on-migrate: false

  kafka:
    bootstrap-servers: ${TEST_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      schema.registry.url: mock://test
    consumer:
      auto-offset-reset: earliest
      group-id: subscription-plan-test

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri:  ${TEST_JWT_ISSUER_URI:http://localhost:9090/realms/modus}
          jwk-set-uri: ${TEST_JWK_SET_URI:http://localhost:9090/realms/modus/protocol/openid-connect/certs}

platform:
  jwt:
    claim-tenant-id: tenant_id
    claim-roles:     roles
    claim-user-id:   sub
  observability:
    mdc-enabled: false

logging:
  level:
    root: WARN
    com.modus.license: DEBUG
    org.flywaydb: INFO

management:
  tracing:
    enabled: false
