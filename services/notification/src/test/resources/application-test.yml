spring:
  config:
    import: ""

  datasource:
    url:      ${TEST_DATASOURCE_URL:jdbc:tc:postgresql:16-alpine:///modus_notification_test}
    username: test
    password: test

  jpa:
    hibernate:
      ddl-auto: none

  flyway:
    enabled: true
    baseline-on-migrate: false

  kafka:
    bootstrap-servers: ${TEST_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      schema.registry.url: mock://test
    consumer:
      auto-offset-reset: earliest
      group-id: notification-test
      properties:
        specific.avro.reader: true

  mail:
    host: localhost
    port: 3025
    username: test
    password: test
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri:  ${TEST_JWT_ISSUER_URI:http://localhost:9090/realms/modus}
          jwk-set-uri: ${TEST_JWK_SET_URI:http://localhost:9090/realms/modus/protocol/openid-connect/certs}

platform:
  jwt:
    claim-tenant-id: tenant_id
    claim-roles:     roles
    claim-user-id:   sub
  observability:
    mdc-enabled: false

notification:
  email:
    from: noreply@test.com
  webhook:
    timeout-ms:     1000
    retry-max:      1
    retry-delay-ms: 100
  renewal-warn-days:
    - 30
    - 7

logging:
  level:
    root: WARN
    com.modus.license: DEBUG

management:
  tracing:
    enabled: false
