server:
  port: ${PORT_TENANT_MANAGEMENT:8081}

spring:
  application:
    name: tenant-management
  config:
    import: "optional:azure-app-configuration:"

  datasource:
    url:                   jdbc:postgresql://${TENANT_DB_HOST:localhost}:${TENANT_DB_PORT:5432}/${TENANT_DB_NAME:modus_tenant}
    username:              ${TENANT_DB_USERNAME:modus_tenant_user}
    password:              ${TENANT_DB_PASSWORD:changeme}
    driver-class-name:     org.postgresql.Driver
    hikari:
      maximum-pool-size:   ${TENANT_DB_POOL_SIZE:20}
      minimum-idle:        ${TENANT_DB_MAX_IDLE:10}
      connection-timeout:  ${TENANT_DB_CONN_TIMEOUT_MS:30000}
      pool-name:           TenantHikariPool

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql:  false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public

  flyway:
    enabled:               ${FLYWAY_ENABLED:true}
    baseline-on-migrate:   ${FLYWAY_BASELINE_ON_MIGRATE:true}
    locations:             classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      security.protocol:  ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism:     ${KAFKA_SASL_MECHANISM:PLAIN}
      sasl.jaas.config:   ${KAFKA_SASL_JAAS_CONFIG:}
      schema.registry.url: ${KAFKA_SCHEMA_REGISTRY_URL:http://localhost:8081}
    producer:
      key-serializer:     org.apache.kafka.common.serialization.StringSerializer
      value-serializer:   io.confluent.kafka.serializers.KafkaAvroSerializer
      acks:               ${KAFKA_PRODUCER_ACKS:all}
      retries:            ${KAFKA_PRODUCER_RETRIES:3}
      properties:
        batch.size:        ${KAFKA_PRODUCER_BATCH_SIZE:16384}
        linger.ms:         ${KAFKA_PRODUCER_LINGER_MS:5}
        compression.type:  ${KAFKA_PRODUCER_COMPRESSION_TYPE:lz4}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri:  ${IAM_ISSUER_URI:http://localhost:8180/realms/modus}
          jwk-set-uri: ${IAM_JWK_SET_URI:http://localhost:8180/realms/modus/protocol/openid-connect/certs}

kafka:
  topics:
    tenant-events: ${KAFKA_TOPIC_TENANT_EVENTS:modus.tenant.events}

platform:
  region:      ${PLATFORM_REGION:eastus}
  home-region: ${PLATFORM_HOME_REGION:eastus}
  jwt:
    claim-tenant-id: ${JWT_CLAIM_TENANT_ID:tenant_id}
    claim-roles:     ${JWT_CLAIM_ROLES:roles}
    claim-user-id:   ${JWT_CLAIM_USER_ID:sub}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_ENABLED:health,info,metrics,prometheus}
  endpoint:
    health:
      show-details: ${MANAGEMENT_HEALTH_SHOW_DETAILS:when-authorized}
  metrics:
    export:
      prometheus:
        enabled: ${METRICS_PROMETHEUS_ENABLED:true}
  tracing:
    enabled:      ${TRACING_ENABLED:true}
    sampling:
      probability: ${TRACING_SAMPLE_RATE:1.0}
  zipkin:
    tracing:
      endpoint: ${TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  level:
    root:              ${LOG_LEVEL:INFO}
    com.modus.license: ${LOG_LEVEL:INFO}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

azure:
  keyvault:
    secret:
      endpoint: ${AZURE_KEYVAULT_URI:}
