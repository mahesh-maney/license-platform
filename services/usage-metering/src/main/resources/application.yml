server:
  port: ${PORT_USAGE_METERING:8089}

spring:
  application:
    name: usage-metering
  config:
    import: "optional:azure-app-configuration:"

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      security.protocol:   ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism:      ${KAFKA_SASL_MECHANISM:PLAIN}
      sasl.jaas.config:    ${KAFKA_SASL_JAAS_CONFIG:}
      schema.registry.url: ${KAFKA_SCHEMA_REGISTRY_URL:http://localhost:8081}
    consumer:
      group-id:           ${KAFKA_CONSUMER_GROUP_PREFIX:modus}-usage-metering
      auto-offset-reset:  ${KAFKA_CONSUMER_AUTO_OFFSET_RESET:earliest}
      enable-auto-commit: ${KAFKA_CONSUMER_ENABLE_AUTO_COMMIT:false}
      key-deserializer:   org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
    producer:
      key-serializer:   org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      acks:             ${KAFKA_PRODUCER_ACKS:all}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri:  ${IAM_ISSUER_URI:http://localhost:8080/realms/modus}
          jwk-set-uri: ${IAM_JWK_SET_URI:http://localhost:8080/realms/modus/protocol/openid-connect/certs}

kafka:
  topics:
    session-events:        ${KAFKA_TOPIC_SESSION_EVENTS:modus.session.events}
    enforcement-decisions: ${KAFKA_TOPIC_ENFORCEMENT_DECISIONS:modus.enforcement.decisions}
    usage-events:          ${KAFKA_TOPIC_USAGE_EVENTS:modus.usage.events}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_ENABLED:health,info,metrics,prometheus}
  metrics:
    export:
      prometheus:
        enabled: ${METRICS_PROMETHEUS_ENABLED:true}
  tracing:
    enabled:     ${TRACING_ENABLED:true}
    sampling:
      probability: ${TRACING_SAMPLE_RATE:1.0}

logging:
  level:
    root:              ${LOG_LEVEL:INFO}
    com.modus.license: ${LOG_LEVEL:INFO}

azure:
  keyvault:
    secret:
      endpoint: ${AZURE_KEYVAULT_URI:}
