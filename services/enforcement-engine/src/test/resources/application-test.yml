spring:
  data:
    redis:
      host: localhost
      port: 6379
      password: ""
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers:localhost:9092}
    consumer:
      group-id:           modus-enforcement-test
      auto-offset-reset:  earliest
      enable-auto-commit: false
      key-deserializer:   org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
    producer:
      key-serializer:   org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
    properties:
      schema.registry.url: mock://test
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9999/test-realm

grpc:
  server:
    port: -1
  client:
    session-service:
      address: static://localhost:9097
      negotiation-type: PLAINTEXT

enforcement:
  cache-warm-on-startup:  false
  decision-timeout-ms:    5000
  cache-miss-fallback-db: false

cache:
  entitlement-ttl-seconds: 300

logging:
  level:
    com.modus.license: DEBUG
