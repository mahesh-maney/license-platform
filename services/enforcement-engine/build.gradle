plugins {
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.jib)
    alias(libs.plugins.protobuf)
}

// Enforcement Engine: fully reactive WebFlux + gRPC, cache-only hot path
dependencies {
    implementation project(':platform:platform-core')
    implementation project(':platform:platform-events')
    implementation project(':platform:platform-security')
    implementation project(':platform:platform-audit')
    implementation project(':platform:platform-observability')

    implementation libs.bundles.webflux.service
    implementation libs.bundles.redis
    implementation libs.bundles.kafka
    implementation libs.bundles.grpc.server
    implementation libs.bundles.grpc.client      // calls Session service via gRPC
    implementation libs.bundles.azure
    implementation libs.resilience4j.spring.boot
    implementation libs.resilience4j.reactor
    implementation libs.micrometer.tracing.brave
    implementation libs.lombok
    implementation 'javax.annotation:javax.annotation-api:1.3.2'

    testImplementation project(':platform:platform-test')
    testImplementation libs.testcontainers.redis
    testImplementation libs.testcontainers.kafka
    testImplementation libs.reactor.test
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:3.25.3"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:1.64.0"
        }
    }
    generateProtoTasks {
        all()*.plugins {
            grpc {}
        }
    }
}

sourceSets {
    main {
        java {
            srcDirs 'build/generated/source/proto/main/grpc'
            srcDirs 'build/generated/source/proto/main/java'
        }
    }
}

jib {
    from { image = 'eclipse-temurin:21-jre-alpine' }
    to   { image = "${System.getenv('CONTAINER_REGISTRY') ?: 'modusacr.azurecr.io'}/enforcement-engine:${project.version}" }
    container {
        jvmFlags = ['-XX:+UseZGC', '-XX:+ZGenerational', '--enable-preview', '-Djava.security.egd=file:/dev/./urandom']
        ports    = ['8088', '9098']   // 8088=HTTP, 9098=gRPC
        labels   = [version: project.version, service: 'enforcement-engine']
    }
}
