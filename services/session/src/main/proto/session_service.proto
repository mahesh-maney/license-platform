syntax = "proto3";

package modus.session;

option java_package         = "com.modus.license.session.grpc";
option java_multiple_files  = true;
option java_outer_classname = "SessionServiceProto";

/**
 * Internal gRPC API consumed by the enforcement-engine to perform
 * fast, low-latency session-count and session-validity checks.
 */
service SessionCheckService {

  /** Returns the current number of active sessions for a tenant. */
  rpc GetActiveSessionCount (ActiveSessionCountRequest)
      returns (ActiveSessionCountResponse);

  /** Validates that a session token is still live and belongs to the stated tenant. */
  rpc ValidateSession (ValidateSessionRequest)
      returns (ValidateSessionResponse);
}

// ── Messages ──────────────────────────────────────────────────────────────────

message ActiveSessionCountRequest {
  string tenant_id = 1;
}

message ActiveSessionCountResponse {
  string tenant_id    = 1;
  int64  active_count = 2;
}

message ValidateSessionRequest {
  string session_id = 1;
  string tenant_id  = 2;
}

message ValidateSessionResponse {
  bool   valid      = 1;
  string user_id    = 2;
  string license_id = 3;  // empty string when not applicable
}
