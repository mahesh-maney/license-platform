spring:
  data:
    redis:
      host: localhost
      port: 6379
      password: ""
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers:localhost:9092}
    producer:
      key-serializer:   org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
    properties:
      schema.registry.url: mock://test
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9999/test-realm

grpc:
  server:
    port: -1   # disable gRPC server in tests

session:
  ttl-seconds:                3600
  heartbeat-interval-seconds: 60
  max-concurrent-default:     50
  cleanup-interval-seconds:   30

logging:
  level:
    com.modus.license: DEBUG
