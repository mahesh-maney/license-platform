server:
  port: ${PORT_REPORTING_ANALYTICS:8090}

spring:
  application:
    name: reporting-analytics
  config:
    import: "optional:azure-app-configuration:"

  datasource:
    url:               jdbc:postgresql://${REPORTING_DB_HOST:localhost}:${REPORTING_DB_PORT:5432}/${REPORTING_DB_NAME:modus_reporting}
    username:          ${REPORTING_DB_USERNAME:modus_report_user}
    password:          ${REPORTING_DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${REPORTING_DB_POOL_SIZE:10}
      pool-name:         ReportingHikariPool

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled:             ${FLYWAY_ENABLED:true}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      security.protocol:   ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism:      ${KAFKA_SASL_MECHANISM:PLAIN}
      sasl.jaas.config:    ${KAFKA_SASL_JAAS_CONFIG:}
      schema.registry.url: ${KAFKA_SCHEMA_REGISTRY_URL:http://localhost:8081}
    consumer:
      group-id:           ${KAFKA_CONSUMER_GROUP_PREFIX:modus}-reporting
      auto-offset-reset:  ${KAFKA_CONSUMER_AUTO_OFFSET_RESET:earliest}
      enable-auto-commit: ${KAFKA_CONSUMER_ENABLE_AUTO_COMMIT:false}
      key-deserializer:   org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri:  ${IAM_ISSUER_URI:http://localhost:8080/realms/modus}
          jwk-set-uri: ${IAM_JWK_SET_URI:http://localhost:8080/realms/modus/protocol/openid-connect/certs}

kafka:
  topics:
    usage-events:          ${KAFKA_TOPIC_USAGE_EVENTS:modus.usage.events}
    entitlement-events:    ${KAFKA_TOPIC_ENTITLEMENT_EVENTS:modus.entitlement.events}
    subscription-events:   ${KAFKA_TOPIC_SUBSCRIPTION_EVENTS:modus.subscription.events}

# Azure Blob Storage for report export
azure:
  storage:
    account-name:   ${AZURE_STORAGE_ACCOUNT_NAME:modusauditstorage}
    container-name: ${AZURE_REPORTING_CONTAINER_NAME:modus-reports}
    endpoint:       ${AZURE_STORAGE_ENDPOINT:}
  keyvault:
    secret:
      endpoint: ${AZURE_KEYVAULT_URI:}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_ENABLED:health,info,metrics,prometheus}
  metrics:
    export:
      prometheus:
        enabled: ${METRICS_PROMETHEUS_ENABLED:true}
  tracing:
    enabled:     ${TRACING_ENABLED:true}
    sampling:
      probability: ${TRACING_SAMPLE_RATE:1.0}

logging:
  level:
    root:              ${LOG_LEVEL:INFO}
    com.modus.license: ${LOG_LEVEL:INFO}
