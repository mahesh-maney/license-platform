server:
  port: ${PORT_USER_MANAGEMENT:8086}

spring:
  application:
    name: user-management
  config:
    import: "optional:azure-app-configuration:"

  datasource:
    url:               jdbc:postgresql://${USER_DB_HOST:localhost}:${USER_DB_PORT:5432}/${USER_DB_NAME:modus_user}
    username:          ${USER_DB_USERNAME:modus_user_svc}
    password:          ${USER_DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${USER_DB_POOL_SIZE:20}
      pool-name:         UserHikariPool

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled:             ${FLYWAY_ENABLED:true}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      security.protocol:   ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism:      ${KAFKA_SASL_MECHANISM:PLAIN}
      sasl.jaas.config:    ${KAFKA_SASL_JAAS_CONFIG:}
      schema.registry.url: ${KAFKA_SCHEMA_REGISTRY_URL:http://localhost:8081}
    producer:
      key-serializer:   org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      acks:             ${KAFKA_PRODUCER_ACKS:all}
    consumer:
      group-id:           ${KAFKA_CONSUMER_GROUP_PREFIX:modus}-user
      auto-offset-reset:  ${KAFKA_CONSUMER_AUTO_OFFSET_RESET:earliest}
      enable-auto-commit: ${KAFKA_CONSUMER_ENABLE_AUTO_COMMIT:false}
      key-deserializer:   org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri:  ${IAM_ISSUER_URI:http://localhost:8180/realms/modus}
          jwk-set-uri: ${IAM_JWK_SET_URI:http://localhost:8180/realms/modus/protocol/openid-connect/certs}

kafka:
  topics:
    user-events:         ${KAFKA_TOPIC_USER_EVENTS:modus.user.events}
    entitlement-events:  ${KAFKA_TOPIC_ENTITLEMENT_EVENTS:modus.entitlement.events}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_ENABLED:health,info,metrics,prometheus}
  metrics:
    export:
      prometheus:
        enabled: ${METRICS_PROMETHEUS_ENABLED:true}
  tracing:
    enabled:     ${TRACING_ENABLED:true}
    sampling:
      probability: ${TRACING_SAMPLE_RATE:1.0}
  zipkin:
    tracing:
      endpoint: ${TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  level:
    root:              ${LOG_LEVEL:INFO}
    com.modus.license: ${LOG_LEVEL:INFO}

azure:
  keyvault:
    secret:
      endpoint: ${AZURE_KEYVAULT_URI:}
