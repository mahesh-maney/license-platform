spring:
  config:
    import: ""

  kafka:
    bootstrap-servers: ${TEST_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      schema.registry.url: mock://test
    producer:
      key-serializer:   org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9999/test-realm

temporal:
  enabled: false
  service-address: localhost:7233
  namespace:        modus-license
  task-queue:       modus-license-tasks
  worker:
    max-concurrent-activities: 10
    max-concurrent-workflows:  5

scheduler:
  renewal-sweep-cron: "0 0 * * *"
  expiry-sweep-cron:  "0 * * * *"
  grace-period-days:  7

services:
  subscription:
    url: http://localhost:8082
  entitlement:
    url: http://localhost:8083
  notification:
    url: http://localhost:8091

platform:
  jwt:
    claim-tenant-id: tenant_id
    claim-roles:     roles
    claim-user-id:   sub

management:
  tracing:
    enabled: false

logging:
  level:
    com.modus.license: DEBUG
    io.temporal:       WARN
