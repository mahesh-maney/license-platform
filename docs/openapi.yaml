openapi: 3.0.3

info:
  title: License Platform API
  description: |
    Complete REST API for the License Platform — a multi-tenant SaaS licensing system
    covering tenant management, subscription plans, entitlements, feature flags,
    named-user licensing, session management, enforcement, usage metering,
    reporting, notifications, audit, and workflow scheduling.

    All requests go through the API Gateway at port **8080**.
    Authentication uses **Bearer JWT tokens** issued by Keycloak (`/realms/license`).

    ## Authentication
    Obtain a token from Keycloak:
    ```
    POST http://localhost:8180/realms/license/protocol/openid-connect/token
    Content-Type: application/x-www-form-urlencoded

    grant_type=password&client_id=license-api&username=admin&password=admin
    ```
    Then set `Authorization: Bearer <token>` on every request.
  version: 1.0.0
  contact:
    name: License Platform Team

servers:
  - url: http://localhost:8080
    description: Local development (via API Gateway)

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TenantId:
      name: X-Tenant-ID
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Tenant UUID — injected by the gateway from the JWT `tenant_id` claim

    PageParam:
      name: page
      in: query
      schema:
        type: integer
        default: 0
        minimum: 0

    SizeParam:
      name: size
      in: query
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100

  schemas:

    # ── Tenant Management ──────────────────────────────────────────────────────

    CreateTenantRequest:
      type: object
      required: [slug, name, displayName, adminEmail, planTier, region]
      properties:
        slug:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$'
          example: acme-corp
        name:
          type: string
          example: ACME Corporation
        displayName:
          type: string
          example: ACME Corp
        adminEmail:
          type: string
          format: email
          example: admin@acme.com
        planTier:
          $ref: '#/components/schemas/PlanTier'
        region:
          type: string
          example: eastus

    TenantResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          example: acme-corp
        name:
          type: string
        displayName:
          type: string
        adminEmail:
          type: string
          format: email
        status:
          $ref: '#/components/schemas/TenantStatus'
        planTier:
          $ref: '#/components/schemas/PlanTier'
        region:
          type: string
        trialEndsAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TenantStatus:
      type: string
      enum: [TRIAL, ACTIVE, SUSPENDED, CANCELLED]

    # ── Subscription Plan ──────────────────────────────────────────────────────

    CreatePlanRequest:
      type: object
      required: [name, tier, licenseType, billingCycle, priceInCents, currency]
      properties:
        name:
          type: string
          example: Enterprise Annual
        description:
          type: string
          example: Full feature access with unlimited seats
        tier:
          $ref: '#/components/schemas/PlanTier'
        licenseType:
          $ref: '#/components/schemas/LicenseType'
        maxSeats:
          type: integer
          nullable: true
          description: null = unlimited
          example: 100
        billingCycle:
          $ref: '#/components/schemas/BillingCycle'
        priceInCents:
          type: integer
          format: int64
          example: 99900
        currency:
          type: string
          example: USD
        features:
          type: array
          items:
            type: string
          example: [feature.advanced-reporting, feature.sso, feature.api-access]

    UpdatePlanRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        maxSeats:
          type: integer
          nullable: true
        priceInCents:
          type: integer
          format: int64
        features:
          type: array
          items:
            type: string

    PlanResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        tier:
          $ref: '#/components/schemas/PlanTier'
        licenseType:
          $ref: '#/components/schemas/LicenseType'
        maxSeats:
          type: integer
          nullable: true
        billingCycle:
          $ref: '#/components/schemas/BillingCycle'
        priceInCents:
          type: integer
          format: int64
        currency:
          type: string
        active:
          type: boolean
        features:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ── Subscription ───────────────────────────────────────────────────────────

    CreateSubscriptionRequest:
      type: object
      required: [planId, billingCycle, seatLimit, startDate]
      properties:
        planId:
          type: string
          format: uuid
        billingCycle:
          $ref: '#/components/schemas/BillingCycle'
        seatLimit:
          type: integer
          example: 50
        startDate:
          type: string
          format: date
          example: '2025-01-01'
        endDate:
          type: string
          format: date
          nullable: true
          description: null = evergreen subscription
          example: '2025-12-31'

    ChangePlanRequest:
      type: object
      required: [newPlanId]
      properties:
        newPlanId:
          type: string
          format: uuid
        effectiveDate:
          type: string
          format: date
          nullable: true

    CancelSubscriptionRequest:
      type: object
      properties:
        reason:
          type: string
          example: Customer requested cancellation

    SubscriptionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        plan:
          $ref: '#/components/schemas/PlanResponse'
        status:
          $ref: '#/components/schemas/SubscriptionStatus'
        seatLimit:
          type: integer
        effectiveSeatLimit:
          type: integer
        billingCycle:
          $ref: '#/components/schemas/BillingCycle'
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          nullable: true
        cancellationReason:
          type: string
          nullable: true
        cancelledAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SubscriptionStatus:
      type: string
      enum: [PENDING, ACTIVE, SUSPENDED, CANCELLED, EXPIRED]

    # ── Entitlement ────────────────────────────────────────────────────────────

    CreateEntitlementRequest:
      type: object
      required: [tenantId, subscriptionId, planId, planTier, licenseType, seatLimit, startDate]
      properties:
        tenantId:
          type: string
          format: uuid
        subscriptionId:
          type: string
          format: uuid
        planId:
          type: string
          format: uuid
        planTier:
          $ref: '#/components/schemas/PlanTier'
        licenseType:
          $ref: '#/components/schemas/LicenseType'
        seatLimit:
          type: integer
        featureKeys:
          type: array
          items:
            type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          nullable: true

    UpdateEntitlementRequest:
      type: object
      properties:
        seatLimit:
          type: integer
        featureKeys:
          type: array
          items:
            type: string
        endDate:
          type: string
          format: date
          nullable: true

    EntitlementResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        subscriptionId:
          type: string
          format: uuid
        planId:
          type: string
          format: uuid
        planTier:
          $ref: '#/components/schemas/PlanTier'
        licenseType:
          $ref: '#/components/schemas/LicenseType'
        seatLimit:
          type: integer
        featureKeys:
          type: array
          items:
            type: string
        status:
          $ref: '#/components/schemas/EntitlementStatus'
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    EntitlementStatus:
      type: string
      enum: [ACTIVE, REVOKED, SUSPENDED, EXPIRED]

    # ── Feature Control ────────────────────────────────────────────────────────

    CreateFeatureRequest:
      type: object
      required: [featureKey, name, minimumPlanTier]
      properties:
        featureKey:
          type: string
          pattern: '^feature\.[a-z0-9-]+$'
          example: feature.advanced-reporting
        name:
          type: string
          example: Advanced Reporting
        description:
          type: string
        minimumPlanTier:
          $ref: '#/components/schemas/PlanTier'
        configSchemaJson:
          type: string
          description: JSON Schema string for per-tenant config overrides
          nullable: true

    UpdateFeatureRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        minimumPlanTier:
          $ref: '#/components/schemas/PlanTier'
        configSchemaJson:
          type: string
          nullable: true

    FeatureResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        featureKey:
          type: string
        name:
          type: string
        description:
          type: string
        minimumPlanTier:
          $ref: '#/components/schemas/PlanTier'
        status:
          $ref: '#/components/schemas/FeatureStatus'
        configSchemaJson:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    FeatureStatus:
      type: string
      enum: [ENABLED, DISABLED, DEPRECATED]

    TenantFeatureResponse:
      type: object
      properties:
        featureKey:
          type: string
        name:
          type: string
        enabled:
          type: boolean
        configOverride:
          type: object
          additionalProperties: true
          nullable: true

    TenantFeatureOverrideRequest:
      type: object
      properties:
        enabled:
          type: boolean
        configOverride:
          type: object
          additionalProperties: true
          nullable: true

    # ── Named-User License ─────────────────────────────────────────────────────

    CreateNamedLicenseRequest:
      type: object
      required: [entitlementId, totalSeats]
      properties:
        entitlementId:
          type: string
          format: uuid
        totalSeats:
          type: integer
          example: 25

    AssignSeatRequest:
      type: object
      required: [userId]
      properties:
        userId:
          type: string
          format: uuid

    TransferSeatRequest:
      type: object
      required: [fromUserId, toUserId]
      properties:
        fromUserId:
          type: string
          format: uuid
        toUserId:
          type: string
          format: uuid

    LicensePoolResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        planId:
          type: string
          format: uuid
        entitlementId:
          type: string
          format: uuid
        totalSeats:
          type: integer
        usedSeats:
          type: integer
        availableSeats:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SeatResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        licenseId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        assignedAt:
          type: string
          format: date-time

    # ── User Management ────────────────────────────────────────────────────────

    CreateUserRequest:
      type: object
      required: [email, firstName, lastName]
      properties:
        email:
          type: string
          format: email
          example: john.doe@acme.com
        firstName:
          type: string
          example: John
        lastName:
          type: string
          example: Doe
        roles:
          type: array
          items:
            type: string
          example: [ROLE_USER]

    UpdateUserRequest:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string

    UpdateRolesRequest:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          items:
            type: string
          example: [ROLE_USER, ROLE_ADMIN]

    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        roles:
          type: array
          items:
            type: string
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ── Session ────────────────────────────────────────────────────────────────

    StartSessionRequest:
      type: object
      required: [userId]
      properties:
        userId:
          type: string
          format: uuid
        licenseId:
          type: string
          format: uuid
          nullable: true
        clientIp:
          type: string
          example: 192.168.1.100
          nullable: true
        userAgent:
          type: string
          example: Mozilla/5.0
          nullable: true

    SessionResponse:
      type: object
      properties:
        sessionId:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        licenseId:
          type: string
          format: uuid
          nullable: true
        clientIp:
          type: string
          nullable: true
        userAgent:
          type: string
          nullable: true
        startedAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time

    # ── Enforcement Engine ─────────────────────────────────────────────────────

    CheckAccessRequest:
      type: object
      required: [userId, featureKey]
      properties:
        userId:
          type: string
          format: uuid
        featureKey:
          type: string
          example: feature.advanced-reporting
        sessionId:
          type: string
          format: uuid
          nullable: true

    CheckAccessResponse:
      type: object
      properties:
        allowed:
          type: boolean
        decision:
          type: string
          enum: [ALLOWED, DENIED]
        denialReason:
          type: string
          nullable: true
          example: SEAT_LIMIT_EXCEEDED
        entitlementId:
          type: string
          format: uuid
          nullable: true
        responseTimeMs:
          type: integer
          format: int64
        cacheHit:
          type: boolean

    # ── Usage Metering ─────────────────────────────────────────────────────────

    RecordUsageRequest:
      type: object
      required: [featureKey, metricName, quantity, unit]
      properties:
        userId:
          type: string
          format: uuid
          nullable: true
        featureKey:
          type: string
          example: feature.api-access
        metricName:
          type: string
          example: api_calls
        quantity:
          type: number
          format: double
          example: 1.0
        unit:
          type: string
          example: CALL

    # ── Reporting & Analytics ──────────────────────────────────────────────────

    UsageReportResponse:
      type: object
      properties:
        tenantId:
          type: string
          format: uuid
        featureKey:
          type: string
        metricName:
          type: string
        totalQuantity:
          type: number
          format: double
        unit:
          type: string
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time

    EntitlementReportResponse:
      type: object
      properties:
        tenantId:
          type: string
          format: uuid
        entitlements:
          type: array
          items:
            $ref: '#/components/schemas/EntitlementResponse'
        asOf:
          type: string
          format: date-time

    SubscriptionSnapshotResponse:
      type: object
      properties:
        subscriptionId:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        planId:
          type: string
          format: uuid
        planTier:
          $ref: '#/components/schemas/PlanTier'
        licenseType:
          $ref: '#/components/schemas/LicenseType'
        billingCycle:
          $ref: '#/components/schemas/BillingCycle'
        seatLimit:
          type: integer
        status:
          $ref: '#/components/schemas/SubscriptionStatus'
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          nullable: true
        recordedAt:
          type: string
          format: date-time

    ExportRequest:
      type: object
      required: [reportType]
      properties:
        reportType:
          type: string
          enum: [USAGE, ENTITLEMENT, SUBSCRIPTION]
        from:
          type: string
          format: date-time
          nullable: true
        to:
          type: string
          format: date-time
          nullable: true

    ExportResponse:
      type: object
      properties:
        exportId:
          type: string
          format: uuid
        reportType:
          type: string
        status:
          type: string
          enum: [QUEUED, PROCESSING, READY, FAILED]
        downloadUrl:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    # ── Notification ───────────────────────────────────────────────────────────

    NotificationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        notificationType:
          type: string
          example: RENEWAL_WARNING
        channel:
          type: string
          enum: [EMAIL, WEBHOOK, IN_APP]
        recipientEmail:
          type: string
          format: email
          nullable: true
        subject:
          type: string
          nullable: true
        status:
          type: string
          enum: [PENDING, SENT, FAILED, RETRYING]
        retryCount:
          type: integer
        failureReason:
          type: string
          nullable: true
        sentAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    # ── Audit ──────────────────────────────────────────────────────────────────

    AuditLogResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        actorId:
          type: string
          format: uuid
        actorType:
          type: string
          enum: [USER, SERVICE, SYSTEM]
        action:
          type: string
          example: TENANT_CREATED
        resourceType:
          type: string
          example: TENANT
        resourceId:
          type: string
          format: uuid
        outcome:
          type: string
          enum: [SUCCESS, FAILURE]
        serviceName:
          type: string
          example: tenant-management
        ipAddress:
          type: string
          nullable: true
        userAgent:
          type: string
          nullable: true
        requestId:
          type: string
          format: uuid
        failureReason:
          type: string
          nullable: true
        recordedAt:
          type: string
          format: date-time
        contentHash:
          type: string
          description: SHA-256 hash for tamper detection

    # ── Scheduler / Workflow ───────────────────────────────────────────────────

    StartLifecycleRequest:
      type: object
      required: [tenantId, subscriptionId, planId, planTier, licenseType, billingCycle, seatLimit, startDate]
      properties:
        tenantId:
          type: string
          format: uuid
        subscriptionId:
          type: string
          format: uuid
        planId:
          type: string
          format: uuid
        planTier:
          $ref: '#/components/schemas/PlanTier'
        licenseType:
          $ref: '#/components/schemas/LicenseType'
        billingCycle:
          $ref: '#/components/schemas/BillingCycle'
        seatLimit:
          type: integer
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          nullable: true

    # ── Shared Enums ───────────────────────────────────────────────────────────

    PlanTier:
      type: string
      enum: [FREE, STARTER, PROFESSIONAL, ENTERPRISE]

    LicenseType:
      type: string
      enum: [NAMED_USER, CONCURRENT, SITE, SUBSCRIPTION]

    BillingCycle:
      type: string
      enum: [MONTHLY, QUARTERLY, ANNUAL, PERPETUAL]

    # ── Common ─────────────────────────────────────────────────────────────────

    PageMeta:
      type: object
      properties:
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer

    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string
        requestId:
          type: string
          format: uuid


# ══════════════════════════════════════════════════════════════════════════════
# PATHS
# ══════════════════════════════════════════════════════════════════════════════
paths:

  # ── Tenant Management ──────────────────────────────────────────────────────

  /api/v1/tenants:
    post:
      tags: [Tenants]
      summary: Create tenant
      operationId: createTenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenantRequest'
            example:
              slug: acme-corp
              name: ACME Corporation
              displayName: ACME Corp
              adminEmail: admin@acme.com
              planTier: ENTERPRISE
              region: eastus
      responses:
        '201':
          description: Tenant created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Slug already exists

    get:
      tags: [Tenants]
      summary: List tenants (paginated)
      operationId: listTenants
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TenantStatus'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      content:
                        type: array
                        items:
                          $ref: '#/components/schemas/TenantResponse'

  /api/v1/tenants/{id}:
    get:
      tags: [Tenants]
      summary: Get tenant by ID
      operationId: getTenant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Tenants]
      summary: Update tenant
      operationId: updateTenant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                adminEmail:
                  type: string
                  format: email
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Tenants]
      summary: Delete tenant
      operationId: deleteTenant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/tenants/slug/{slug}:
    get:
      tags: [Tenants]
      summary: Get tenant by slug
      operationId: getTenantBySlug
