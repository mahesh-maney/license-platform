// platform-security: JWT validation, tenant context propagation, RBAC base config
dependencies {
    implementation project(':platform:platform-core')
    implementation libs.spring.boot.security
    implementation libs.spring.boot.oauth2.resource
    implementation libs.spring.boot.webflux
    implementation libs.bundles.jwt
    implementation libs.bundles.azure
    implementation libs.lombok

    // Servlet API — compileOnly so the library can compile TenantContextFilter
    // without forcing the Servlet stack onto WebFlux services. Servlet services
    // (tenant-management, subscription-plan, etc.) bring spring-boot-web themselves.
    compileOnly libs.spring.boot.web

    testImplementation libs.bundles.testing
    testImplementation libs.spring.boot.test
}
